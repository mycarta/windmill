<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Windmill Step 0 preview: proposed palette, turbine symbol (two colour
       options), a hit turbine, one wake streak, and a 16-point compass.
       Not game code. Cells are 100 units, drawn exactly like Dandelions'
       cells (rect inset 5, 90x90, rx 10). -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Turbine symbol, centred on (0,0) = cell centre (where wakes start).
         Rotor = three tapered blades + hub, echoing the arms of the
         Dandelions flower (the ✱ glyph). The tower sits below the hub and is
         never rotated; only the rotor gets the per-cell random rotation,
         set with an SVG transform attribute, as Dandelions does. -->
    <path id="blade" d="M -1.8 -4 C -5.8 -10 -5.2 -19 -1.6 -26 Q 0 -28.4 1.6 -26.6 C 3.2 -19 3.2 -10 1.8 -4 Z"/>
    <path id="tower" d="M -1.6 4 L -3.4 36 L 3.4 36 L 1.6 4 Z"/>

  </defs>

  <rect width="800" height="450" fill="#1a2e3d"/>

  <!-- ── Top row: the four cell states ─────────────────────────────── -->
  <g transform="translate(20,20)">
    <rect width="400" height="100" rx="12" fill="#162632"/>
    <!-- empty -->
    <rect x="5" y="5" width="90" height="90" rx="10" fill="#30859e" stroke="#205d70" stroke-width="1.5"/>
    <!-- turbine, option A (gold) -->
    <rect x="105" y="5" width="90" height="90" rx="10" fill="#244f6e" stroke="#1a394f" stroke-width="1.5"/>
    <g filter="url(#shadow)" transform="translate(150,48)"><use href="#tower" fill="#f5e642" opacity="0.85"/><g transform="rotate(-18)" fill="#f5e642"><use href="#blade"/><use href="#blade" transform="rotate(120)"/><use href="#blade" transform="rotate(240)"/><circle r="4.6"/></g></g>
    <!-- turbine, option B (white, gold hub) -->
    <rect x="205" y="5" width="90" height="90" rx="10" fill="#244f6e" stroke="#1a394f" stroke-width="1.5"/>
    <g filter="url(#shadow)" transform="translate(250,48)"><use href="#tower" fill="#e8f0f5" opacity="0.85"/><g transform="rotate(25)"><use href="#blade" fill="#e8f0f5"/><use href="#blade" fill="#e8f0f5" transform="rotate(120)"/><use href="#blade" fill="#e8f0f5" transform="rotate(240)"/></g><circle r="4.6" fill="#f5e642"/></g>
    <!-- hit turbine (option B) -->
    <rect x="305" y="5" width="90" height="90" rx="10" fill="#244f6e" stroke="#ef9a9a" stroke-width="3"/>
    <g filter="url(#shadow)" transform="translate(350,48)"><use href="#tower" fill="#e8f0f5" opacity="0.85"/><g transform="rotate(8)"><use href="#blade" fill="#e8f0f5"/><use href="#blade" fill="#e8f0f5" transform="rotate(120)"/><use href="#blade" fill="#e8f0f5" transform="rotate(240)"/></g><circle r="4.6" fill="#f5e642"/></g>
  </g>
  <g fill="#a8c4d8" font-size="13" text-anchor="middle">
    <text x="70" y="140">empty</text>
    <text x="170" y="140">A: gold</text>
    <text x="270" y="140">B: white</text>
    <text x="370" y="140">hit</text>
  </g>

  <!-- ── Bottom: a W wind (blows east). Left turbine's wake hits the right one. -->
  <g transform="translate(20,170)">
    <rect width="400" height="200" rx="12" fill="#162632"/>
    <g fill="#30859e" stroke="#205d70" stroke-width="1.5">
      <rect x="5" y="5" width="90" height="90" rx="10"/><rect x="105" y="5" width="90" height="90" rx="10"/>
      <rect x="205" y="5" width="90" height="90" rx="10"/><rect x="305" y="5" width="90" height="90" rx="10"/>
      <rect x="205" y="105" width="90" height="90" rx="10"/><rect x="5" y="105" width="90" height="90" rx="10"/>
    </g>
    <rect x="105" y="105" width="90" height="90" rx="10" fill="#244f6e" stroke="#1a394f" stroke-width="1.5"/>
    <rect x="305" y="105" width="90" height="90" rx="10" fill="#244f6e" stroke="#ef9a9a" stroke-width="3"/>
    <!-- wake streak: from turbine centre downwind, width 2 x WAKE_HALF_WIDTH = 1 cell,
         clipped at the board edge -->
    <rect x="150" y="100" width="250" height="100" fill="#c5d9e8" opacity="0.22"/>
    <g filter="url(#shadow)" transform="translate(150,148)"><use href="#tower" fill="#e8f0f5" opacity="0.85"/><g transform="rotate(-30)"><use href="#blade" fill="#e8f0f5"/><use href="#blade" fill="#e8f0f5" transform="rotate(120)"/><use href="#blade" fill="#e8f0f5" transform="rotate(240)"/></g><circle r="4.6" fill="#f5e642"/></g>
    <g filter="url(#shadow)" transform="translate(350,148)"><use href="#tower" fill="#e8f0f5" opacity="0.85"/><g transform="rotate(14)"><use href="#blade" fill="#e8f0f5"/><use href="#blade" fill="#e8f0f5" transform="rotate(120)"/><use href="#blade" fill="#e8f0f5" transform="rotate(240)"/></g><circle r="4.6" fill="#f5e642"/></g>
  </g>
  <text x="220" y="398" fill="#a8c4d8" font-size="13" text-anchor="middle">wind from W: wake streak and the turbine it hits</text>

  <!-- ── Compass, 16 points (replay look): original 8 used/greyed vs the 8 added ── -->
  <g transform="translate(620,195)">
    <circle r="150" fill="#11202b"/>
    <circle r="136" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <circle r="5" fill="#a8c4d8"/>
    <g font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central">
      <!-- original 8 (as in the 8-direction setting) -->
      <text x="0" y="-112" fill="#c5d9e8">N</text>
      <text x="79" y="-79" fill="#4a5d6a" opacity="0.45">NE</text>
      <text x="112" y="0" fill="#c5d9e8">E</text>
      <text x="79" y="79" fill="#c5d9e8">SE</text>
      <text x="0" y="112" fill="#4a5d6a" opacity="0.45">S</text>
      <text x="-79" y="79" fill="#c5d9e8">SW</text>
      <text x="-112" y="0" fill="#f5e642" font-size="16">W</text>
      <text x="-79" y="-79" fill="#c5d9e8">NW</text>
    </g>
    <g font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#60ccdb">
      <!-- the 8 added in 16 directions: different shade -->
      <text x="43" y="-103">NNE</text>
      <text x="103" y="-43">ENE</text>
      <text x="103" y="43">ESE</text>
      <text x="43" y="103">SSE</text>
      <text x="-43" y="103">SSW</text>
      <text x="-103" y="43">WSW</text>
      <text x="-103" y="-43">WNW</text>
      <text x="-43" y="-103">NNW</text>
    </g>
  </g>
  <text x="620" y="372" fill="#a8c4d8" font-size="13" text-anchor="middle">gold = current gust · grey = used</text><text x="620" y="392" fill="#a8c4d8" font-size="13" text-anchor="middle">cyan = the 8 added in 16 directions</text>
</svg>
