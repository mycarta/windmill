<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windmill UI smoke test</title>
<style>
  body { background: #1a2e3d; color: #e8f0f5; font-family: system-ui, sans-serif; padding: 16px; }
  pre  { font-size: 13px; line-height: 1.5; }
  iframe { width: 1150px; height: 900px; border: 1px solid #2e4b5f; display: block; margin-top: 12px; }
</style>
</head>
<body>
<h1>Windmill: UI smoke test</h1>
<p>Drives the real game (<code>../index.html</code>) in iframes and checks what it shows.
   Needs a local web server (iframes on <code>file://</code> are blocked), e.g.
   <code>python3 -m http.server</code> in the repo root, then open
   <code>http://localhost:8000/tests/ui-smoke.html</code>. The title shows PASS or FAIL.</p>
<pre id="results">running…</pre>
<iframe id="pick" title="game, tap-to-pick mode"></iframe>
<iframe id="rand" title="game, random wind"></iframe>
<iframe id="lines" title="game, tap-to-pick with knight lines"></iframe>
<iframe id="play" title="game, Play mode"></iframe>
<script>
const lines = [];
let passed = 0, failed = 0;
function check(name, ok, detail) {
  if (ok) { passed++; lines.push('PASS  ' + name); }
  else    { failed++; lines.push('FAIL  ' + name + (detail !== undefined ? '  -> ' + detail : '')); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function load(frame, src) {
  return new Promise(resolve => {
    frame.onload = () => resolve(frame.contentWindow);
    frame.src = src;
  });
}

async function run() {
  // ── Tap-to-pick mode: deterministic directions ───────────────────────────
  const w = await load(document.getElementById('pick'), '../index.html?wind=pick');
  await sleep(100);
  const d = w.document;
  const $ = id => d.getElementById(id);
  const click = el => el.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  const cell = (x, y) => click($(`cell-${x}-${y}`));
  const pick = dir => click($(`dir-${dir}`));
  const count = sel => d.querySelectorAll(sel).length;
  const text = id => $(id).textContent.trim();
  const recordLines = () => [...d.querySelectorAll('#record li')].map(li => li.textContent);
  const headerLines = () => [...d.querySelectorAll('#turn-line .line')].map(e => e.textContent.trim());
  const boardTop = () => Math.round($('grid').getBoundingClientRect().top);

  lines.push('-- modes');
  check('Play opens first', d.querySelector('.mode-tab.active').dataset.mode === 'play'
        && !$('play-controls').hidden && $('replay-btn').hidden);
  click(d.querySelector('.mode-tab[data-mode="learn"]'));
  check('Learn tab shows the Learn game', d.querySelector('.mode-tab.active').dataset.mode === 'learn'
        && $('play-controls').hidden);

  lines.push('-- start (tap-to-pick mode)');
  check('title is Windmill', d.title === 'Windmill', d.title);
  check('81 squares', count('.cell') === 81, count('.cell'));
  check('axis numbers 0-8 on two sides', count('.axis-label') === 18);
  check('turn line "Turn 1 of 8"', text('turn-line') === 'Turn 1 of 8', text('turn-line'));
  check('status asks for a turbine', text('status') === 'Tap a square to place a turbine', text('status'));
  check('compass has 8 directions', count('#compass .dir-group') === 8);
  check('rule line names 8 directions', text('rule-line') === 'In this game, the wind blows only in the 8 directions on the compass.');
  check('legend: Wind now / Still to come / Used', text('legend') === 'Wind nowStill to comeUsed', text('legend'));
  check('replay button shown but disabled', !$('replay-btn').hidden && $('replay-btn').disabled);

  lines.push('-- turn 1');
  cell(4, 4);
  check('placing asks for a direction', text('status') === 'Pick a wind direction on the compass', text('status'));
  check('all 8 directions tappable', count('#compass .dir-group.tappable') === 8);
  cell(5, 5);
  check('no second turbine before the gust', count('#turbines .turbine-symbol') === 1);
  pick('N');
  check('header shows the wind on its second line', headerLines().join(' / ') === 'Turn 1 of 8 / Wind blows N', headerLines().join(' / '));
  check('first gust: no hits', text('status') === 'No turbines hit. Tap a square for the next turbine.', text('status'));
  check('first gust still draws its wake', count('#wakes .wake') === 1);
  check('record: "N — none"', recordLines()[0] === 'N — none', recordLines()[0]);
  check('N is gold (active)', $('dir-N').querySelector('text').classList.contains('active'));
  check('nothing tappable after the gust', count('#compass .dir-group.tappable') === 0);

  lines.push('-- turn 2');
  cell(4, 2);
  check('previous wakes clear on placement', count('#wakes .wake') === 0);
  check('N now dimmed (used)', $('dir-N').querySelector('text').classList.contains('used'));
  check('used N not tappable', !$('dir-N').classList.contains('tappable') && count('#compass .dir-group.tappable') === 7);
  pick('N');
  check('a used direction cannot be picked again', recordLines().length === 1);
  pick('S');
  check('S wind: (4,4) hits (4,2)', text('status') === '1 turbine hit. Tap a square for the next turbine.', text('status'));
  check('one red border', count('#hit-borders .hit-border') === 1);
  check('two wakes (every turbine casts one)', count('#wakes .wake') === 2);
  check('record: "S — hit: (4,2)"', recordLines()[1] === 'S — hit: (4,2)', recordLines()[1]);
  check('replay button enabled with 2 turbines', !$('replay-btn').disabled);
  const lostAt = (x, y) => d.querySelector(`#turbines .turbine-symbol[data-x="${x}"][data-y="${y}"]`).classList.contains('lost');
  check('the hit turbine (4,2) has lost output (vermilion)', lostAt(4, 2) && !lostAt(4, 4));
  check('board legend: Hit now / Lost output', text('board-legend').replace(/\s+/g, ' ') === 'Hit now Lost output', text('board-legend'));

  lines.push('-- replay with 16 directions (2 turbines in a column)');
  const turnBefore = text('turn-line'), statusBefore = text('status'), topBefore = boardTop();
  click($('replay-btn'));
  check('board does not move when the replay opens', boardTop() === topBefore, topBefore + ' -> ' + boardTop());
  check('replay compass has 16 directions', count('#compass .dir-group') === 16);
  check('replay legend has 4 items', count('#legend .legend-item') === 4, text('legend'));
  check('game controls hidden in replay', $('game-buttons').hidden && $('record').hidden && $('rule-line').hidden);
  check('setting toggle disabled in replay', [...d.querySelectorAll('.set-btn')].every(b => b.disabled));
  check('replay starts at N, with no L (public replay)', headerLines().join(' / ') === 'Replay with 16 directions / Wind blows N · 1 of 16'
        && count('#l-lines .l-line') === 0, headerLines().join(' / '));
  check('added directions are periwinkle', $('dir-NNE').querySelector('text').classList.contains('added'));
  check('replay starts fresh: at N only (4,4) has lost output', lostAt(4, 4) && !lostAt(4, 2));
  click($('step-btn'));
  check('Step pauses: button now says Play', text('pause-btn') === 'Play');
  check('Step moves to NNE', text('turn-line').includes('Wind blows NNE'), text('turn-line'));
  check('N is used, NNE active', $('dir-N').querySelector('text').classList.contains('used')
        && $('dir-NNE').querySelector('text').classList.contains('active'));
  for (let i = 0; i < 15; i++) click($('step-btn'));
  check('end: counts for 8', text('summary-8') === 'Hit by at least one of the 8 directions: 2 of 2 turbines', text('summary-8'));
  check('end: counts for 16', text('summary-16') === 'Hit by at least one of the 16 directions: 2 of 2 turbines', text('summary-16'));
  check('board does not move at the end of the replay', boardTop() === topBefore, topBefore + ' -> ' + boardTop());
  check('end: header keeps two lines, the second empty', headerLines().join(' / ') === 'Replay with 16 directions / ',
        headerLines().join(' / '));
  check('end: only Close remains', $('pause-btn').hidden && $('step-btn').hidden && !$('close-btn').hidden);
  check('end: both turbines lost output, no borders', lostAt(4, 4) && lostAt(4, 2) && count('#hit-borders .hit-border') === 0);
  click($('close-btn'));
  check('board does not move when the replay closes', boardTop() === topBefore, topBefore + ' -> ' + boardTop());
  check('Close: compass back to 8', count('#compass .dir-group') === 8);
  check('Close: game unchanged (record, turn line, status)',
        recordLines().length === 2 && text('turn-line') === turnBefore && text('status') === statusBefore);
  check('Close: game legend back', text('legend') === 'Wind nowStill to comeUsed', text('legend'));
  check('Close: game buttons back', !$('game-buttons').hidden && !$('record').hidden);
  check('Close: lost output back to the game\'s own', lostAt(4, 2) && !lostAt(4, 4));

  lines.push('-- turn 3: the wake passes, the loss stays');
  cell(0, 0);
  pick('E');
  check('E wind hits nothing: no red borders', count('#hit-borders .hit-border') === 0, text('status'));
  check('(4,2) still shows lost output', lostAt(4, 2) && !lostAt(4, 4) && !lostAt(0, 0));

  lines.push('-- left-hand knight set: 0 hit at 8, 5 hit at 16');
  click($('reset-btn'));
  check('Reset clears the board and record', count('#turbines .turbine-symbol') === 0 && recordLines().length === 0);
  const knight = [[4,4,'N'], [6,5,'NE'], [3,6,'E'], [2,3,'SE'], [5,2,'S']];
  for (const [x, y, dir] of knight) { cell(x, y); pick(dir); }
  check('5 turbines, 5 record lines', count('#turbines .turbine-symbol') === 5 && recordLines().length === 5);
  click($('replay-btn'));
  let lCount = 0, eneFrames = 0, frames = 0;
  for (let i = 0; i < 40 && !$('pause-btn').hidden; i++) {
    frames++; lCount += count('#l-lines .l-line');
    if (text('turn-line').includes('Wind blows ENE')) eneFrames++;
    click($('step-btn'));
  }
  check('public replay: one frame per gust, no Ls at all', frames === 16 && eneFrames === 1 && lCount === 0,
        frames + ' frames, ' + eneFrames + ' ENE, ' + lCount + ' Ls');
  check('end: 0 of 5 for 8 directions', text('summary-8') === 'Hit by at least one of the 8 directions: 0 of 5 turbines', text('summary-8'));
  check('end: 5 of 5 for 16 directions', text('summary-16') === 'Hit by at least one of the 16 directions: 5 of 5 turbines', text('summary-16'));
  check('end: legend shows only the two families', count('#legend .legend-item') === 2
        && text('legend') === '8 directionsAdded in 16 directions', text('legend'));
  check('end: compass lit as a key, 8 pale + 8 periwinkle, none used or gold',
        d.querySelectorAll('#compass text.used, #compass text.active').length === 0
        && d.querySelectorAll('#compass text.added').length === 8);
  check('end: all 5 turbines lost output, and no borders at all',
        count('#turbines .turbine-symbol.lost') === 5 && count('#hit-borders rect') === 0);
  click($('close-btn'));

  lines.push('-- end of game');
  for (const [x, y, dir] of [[0,0,'SW'], [8,8,'W'], [0,8,'NW']]) { cell(x, y); pick(dir); }
  check('8 gusts recorded', recordLines().length === 8);
  check('status says all 8 directions have blown', text('status').endsWith('All 8 directions have blown.'), text('status'));
  cell(8, 0);
  check('no placement after the end', count('#turbines .turbine-symbol') === 8);
  check('replay still available after the end', !$('replay-btn').disabled);

  lines.push('-- 16 directions setting');
  click(d.querySelector('.set-btn[data-setting="16"]'));
  check('switching resets the game', count('#turbines .turbine-symbol') === 0 && recordLines().length === 0);
  check('compass has 16 directions', count('#compass .dir-group') === 16);
  check('caption and rule line say 16', text('compass-caption') === '16 directions'
        && text('rule-line') === 'In this game, the wind blows only in the 16 directions on the compass.');
  check('turn line "Turn 1 of 16"', text('turn-line') === 'Turn 1 of 16');
  check('no replay button in 16 directions', $('replay-btn').hidden);

  // ── Private knight lines (?lines=knight) ─────────────────────────────────
  lines.push('-- knight lines (?wind=pick&lines=knight)');
  const k = await load(document.getElementById('lines'), '../index.html?wind=pick&lines=knight');
  await sleep(100);
  const kd = k.document;
  const k$ = id => kd.getElementById(id);
  const kclick = el => el.dispatchEvent(new k.MouseEvent('click', { bubbles: true }));
  const ktext = id => k$(id).textContent.trim();
  const kcount = sel => kd.querySelectorAll(sel).length;
  kclick(kd.querySelector('.mode-tab[data-mode="learn"]'));
  const kplace = (x, y, dir) => { kclick(k$(`cell-${x}-${y}`)); kclick(k$(`dir-${dir}`)); };
  // Walk the replay; returns {dir: [frames, Ls, borders]} per gust.
  const walk = () => {
    const seen = {};
    for (let i = 0; i < 60 && !k$('pause-btn').hidden; i++) {
      const dir = ktext('turn-line').match(/Wind blows (\w+)/)[1];
      const e = seen[dir] || (seen[dir] = [0, 0, 0]);
      e[0]++; e[1] += kcount('#l-lines .l-line'); e[2] = kcount('#hit-borders .hit-border');
      kclick(k$('step-btn'));
    }
    return seen;
  };
  kplace(0, 1, 'N'); kplace(3, 4, 'E');
  kclick(k$('replay-btn'));
  let seen = walk();
  check('diagonal hit (3 across, 3 up) under SW: border, no L', seen.SW && seen.SW[2] === 1 && seen.SW[1] === 0,
        JSON.stringify(seen.SW));
  check('no Ls anywhere for a diagonal pair', Object.values(seen).every(e => e[1] === 0));
  kclick(k$('close-btn'));
  kclick(k$('reset-btn'));
  for (const [x, y, dir] of knight) kplace(x, y, dir);
  kclick(k$('replay-btn'));
  seen = walk();
  check('ENE: one L for each knight\'s-move pair (2 frames, 1 L each)', seen.ENE && seen.ENE[0] === 2 && seen.ENE[1] === 2,
        JSON.stringify(seen.ENE));
  check('original 8 directions never draw an L', ['N','NE','E','SE','S','SW','W','NW'].every(dd => seen[dd][1] === 0));
  check('knight Ls do appear, in added directions', Object.entries(seen).some(([dd, e]) => e[1] > 0));
  kclick(k$('close-btn'));

  // ── Random wind (normal mode) ────────────────────────────────────────────
  lines.push('-- random wind (normal URL)');
  const r = await load(document.getElementById('rand'), '../index.html');
  await sleep(100);
  const rd = r.document;
  const rclick = el => el.dispatchEvent(new r.MouseEvent('click', { bubbles: true }));
  rclick(rd.querySelector('.mode-tab[data-mode="learn"]'));
  rclick(rd.getElementById('cell-1-1'));
  check('compass not tappable in normal mode', rd.querySelectorAll('#compass .dir-group.tappable').length === 0);
  check('status while waiting', rd.getElementById('status').textContent === 'The wind is blowing…');
  await sleep(800);
  const cells = [[3,1],[5,1],[7,1],[1,4],[3,4],[5,4],[7,4]];
  for (const [x, y] of cells) { rclick(rd.getElementById(`cell-${x}-${y}`)); await sleep(800); }
  const dirs = [...rd.querySelectorAll('#record li .rec-dir')].map(s => s.textContent);
  check('8 gusts, each direction exactly once', dirs.length === 8 && new Set(dirs).size === 8
        && dirs.every(x => ['N','NE','E','SE','S','SW','W','NW'].includes(x)), dirs.join(' '));
  check('random game ends', rd.getElementById('status').textContent.endsWith('All 8 directions have blown.'));

  // ── Play mode: place all 8, then the winds blow in compass order ─────────
  lines.push('-- Play mode, 8 winds');
  const p = await load(document.getElementById('play'), '../index.html');
  await sleep(100);
  const pd = p.document;
  const p$ = id => pd.getElementById(id);
  const pclick = el => el.dispatchEvent(new p.MouseEvent('click', { bubbles: true }));
  const pcell = (x, y) => pclick(p$(`cell-${x}-${y}`));
  const ptext = id => p$(id).textContent.trim();
  const pcount = sel => pd.querySelectorAll(sel).length;
  const pheader = () => [...pd.querySelectorAll('#turn-line .line')].map(e => e.textContent.trim()).join(' / ');
  const ptop = () => Math.round(p$('grid').getBoundingClientRect().top);
  const ctop = () => Math.round(p$('compass').getBoundingClientRect().top);
  const top0 = ptop(), ctop0 = ctop();
  const count4 = () => pcount('#legend .legend-item') === 4 && ptext('legend').includes('Added in 16 directions');
  check('empty board: "None placed yet"', pheader() === 'None placed yet / Place all 8, then the wind blows', pheader());
  check('start button shown, disabled', !p$('start-btn').hidden && p$('start-btn').disabled
        && p$('next-btn').hidden && p$('all-btn').hidden);
  check('no compass direction tappable while placing', pcount('#compass .dir-group.tappable') === 0);
  pcell(0, 0); pcell(1, 4); pcell(2, 7);
  check('3 placed: "3 of 8 placed"', pheader().startsWith('3 of 8 placed'), pheader());
  pcell(1, 4);
  check('tap a turbine to remove it', pcount('#turbines .turbine-symbol') === 2 && pheader().startsWith('2 of 8 placed'), pheader());
  // Eight queens: no two share a row, column or diagonal, so 8 winds hit nothing
  for (const [x, y] of [[1,4],[3,5],[4,2],[5,6],[6,1],[7,3]]) pcell(x, y);
  check('8 placed: header and start enabled', pheader() === 'All 8 turbines placed / Then 8 winds will blow'
        && !p$('start-btn').disabled, pheader());
  pcell(8, 8);
  check('no ninth turbine', pcount('#turbines .turbine-symbol') === 8);
  pclick(p$('start-btn'));
  check('first wind: "Wind 1 of 8 / Wind blows N"', pheader() === 'Wind 1 of 8 / Wind blows N', pheader());
  check('reveal shows Next wind and Play all', !p$('next-btn').hidden && !p$('all-btn').hidden && p$('start-btn').hidden);
  check('every turbine casts a wake', pcount('#wakes .wake') === 8);
  pcell(8, 8);
  check('no placing during the wind', pcount('#turbines .turbine-symbol') === 8);
  pclick(p$('all-btn'));
  check('Play all: button says Pause, Next wind disabled', ptext('all-btn') === 'Pause' && p$('next-btn').disabled);
  pclick(p$('all-btn'));
  check('Pause: button back to Play all', ptext('all-btn') === 'Play all' && !p$('next-btn').disabled);
  const at = pheader().match(/Wind (\d+)/)[1] * 1;
  for (let i = at; i <= 8; i++) pclick(p$('next-btn'));
  check('verdict: "Lost output: 0 of 8 turbines / Acceptable: none"',
        pheader() === 'Lost output: 0 of 8 turbines / Acceptable: none', pheader());
  check('0 lost with 8 winds is the best possible', ptext('status').startsWith('The best possible result.'), ptext('status'));
  check('after the end: New game, wind buttons gone', ptext('reset-btn') === 'New game' && p$('next-btn').hidden && p$('all-btn').hidden);
  check('end compass: every direction tappable', pcount('#compass .dir-group.tappable') === 8);
  check('end legend: Shown now / Tap to look again', ptext('legend') === 'Shown nowTap to look again', ptext('legend'));
  pclick(p$('dir-NE'));
  check('review a direction: its wakes and status', pcount('#wakes .wake') === 8
        && ptext('status') === 'Wind blows NE: no turbines hit.' && p$('dir-NE').querySelector('text').classList.contains('active'),
        ptext('status'));
  pclick(p$('dir-NE'));
  check('tap it again to clear', pcount('#wakes .wake') === 0 && ptext('status').startsWith('The best possible result.'));
  pcell(0, 0);
  check('review a turbine never hit', ptext('status') === '(0,0) was never hit.' && pcount('#hit-borders .select-border') === 1,
        ptext('status'));

  lines.push('-- Play mode, 16 winds');
  pclick(pd.querySelector('.set-btn[data-setting="16"]'));
  check('switching to 16 starts a new game', pcount('#turbines .turbine-symbol') === 0 && pheader().startsWith('None placed yet'));
  for (const [x, y] of [[3,3],[0,5],[5,6],[6,1],[1,0],[2,8],[8,4],[8,8]]) pcell(x, y);
  pclick(p$('start-btn'));
  check('16 winds in turn', pheader() === 'Wind 1 of 16 / Wind blows N', pheader());
  const order = p.eval('play.dirs').join(' ');
  check('16-wind order: round the compass, or the 8 main then the 8 added',
        order === 'N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW'
        || order === 'N NE E SE S SW W NW NNE ENE ESE SSE SSW WSW WNW NNW', order);
  const orders = new Set();
  for (let i = 0; i < 40; i++) { orders.add(p.eval('playOrder().join(" ")')); }
  check('both orders occur', orders.size === 2, orders.size);
  const periwinkle = pd.querySelectorAll('#compass text.added').length;
  check('periwinkle added directions only when the main winds go first',
        order.startsWith('N NE') ? periwinkle === 8 && count4() : periwinkle === 0, order + ': ' + periwinkle);
  for (let i = 0; i < 16; i++) pclick(p$('next-btn'));
  check('verdict: 3 of 8 lost, acceptable half or fewer',
        pheader() === 'Lost output: 3 of 8 turbines / Acceptable: half or fewer', pheader());
  check('3 lost with 16 winds is the best possible', ptext('status').startsWith('The best possible result.'), ptext('status'));
  check('3 turbines show lost output', pcount('#turbines .turbine-symbol.lost') === 3);
  pcell(2, 8);
  check('review a lost turbine: which winds hit it', ptext('status') === '(2,8) was hit by W.'
        && p$('dir-W').querySelector('text').classList.contains('active') && pcount('#wakes .wake') === 1, ptext('status'));
  check('board and compass never moved in Play', ptop() === top0 && ctop() === ctop0,
        top0 + '/' + ctop0 + ' -> ' + ptop() + '/' + ctop());
  pclick(p$('reset-btn'));
  check('New game clears the board', pcount('#turbines .turbine-symbol') === 0 && pheader().startsWith('None placed yet'));

  lines.push('');
  lines.push((failed === 0 ? 'ALL PASSED' : 'FAILURES') + ': ' + passed + ' passed, ' + failed + ' failed');
  document.getElementById('results').textContent = lines.join('\n');
  document.title = (failed === 0 ? 'PASS ' : 'FAIL ') + passed + '/' + (passed + failed);
}

run().catch(e => {
  lines.push('ERROR ' + (e && e.stack || e));
  document.getElementById('results').textContent = lines.join('\n');
  document.title = 'FAIL error';
});
</script>
</body>
</html>
